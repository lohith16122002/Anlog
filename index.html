<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#07111f">
    <title>Analog Clock</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="clock-card">
        <p class="eyebrow">Local time</p>
        <section class="clock" aria-label="Analog clock showing the current local time">
            <div class="face" aria-hidden="true">
                <div class="number number-12">12</div>
                <div class="number number-3">3</div>
                <div class="number number-6">6</div>
                <div class="number number-9">9</div>
                <div class="tick tick-1"></div><div class="tick tick-2"></div>
                <div class="tick tick-4"></div><div class="tick tick-5"></div>
                <div class="tick tick-7"></div><div class="tick tick-8"></div>
                <div class="tick tick-10"></div><div class="tick tick-11"></div>
            </div>
            <div class="hand hour-hand" aria-hidden="true"></div>
            <div class="hand minute-hand" aria-hidden="true"></div>
            <div class="hand second-hand" aria-hidden="true"></div>
            <div class="pin" aria-hidden="true"></div>
        </section>
        <p class="digital-time" aria-live="polite"><time id="digital-time">00:00:00</time></p>
        <p class="date" id="date">Loading date…</p>
    </main>
    <script src="script.js"></script>
</body>
</html>
